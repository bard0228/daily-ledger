<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f0f3f8">
  <meta name="description" content="日常記帳本">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日常記帳本">
  <title>日常記帳本</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="liquid-glass-kit.css">
  <style>
    :root {
      --sage: var(--accent-sage);
      --sage-bg: rgba(91, 130, 112, 0.13);
      --rose: var(--accent-rose);
      --rose-bg: rgba(168, 108, 114, 0.13);
      --accent: var(--accent-slate);

      --glass-well: linear-gradient(150deg, rgba(255, 255, 255, 0.66) 0%, rgba(246, 250, 255, 0.44) 100%);
      --glass-pill: linear-gradient(135deg, rgba(255, 255, 255, 0.78) 0%, rgba(246, 250, 255, 0.56) 100%);
      --blur-soft: blur(18px) saturate(165%);

      --spec-inset:
        inset 0 1px 1px rgba(255, 255, 255, 0.92),
        inset 0 -1px 1px rgba(255, 255, 255, 0.42);
      --elev-rest:
        0 14px 32px -10px rgba(45, 58, 76, 0.10),
        0 4px 12px -3px rgba(45, 58, 76, 0.05);
      --elev-float:
        0 20px 42px -12px rgba(45, 58, 76, 0.16),
        0 8px 18px -4px rgba(45, 58, 76, 0.08);
      --elev-well:
        0 8px 20px -8px rgba(45, 58, 76, 0.08),
        0 2px 6px -1px rgba(45, 58, 76, 0.04);
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.55;
      padding: env(safe-area-inset-top, 0px) 0 calc(env(safe-area-inset-bottom, 0px) + 84px);
      overflow-x: hidden;
    }

    .shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 頂部懸浮液態導覽列 */
    header.topbar {
      position: sticky;
      top: max(10px, env(safe-area-inset-top, 10px));
      z-index: 40;
      margin: 12px 0 18px;
      padding: 10px 12px 10px 14px;
      border-radius: var(--r-panel);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: nowrap;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.68) 0%, rgba(246, 250, 255, 0.46) 100%);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-shrink: 1;
    }

    .brand-avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--r-icon);
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(45, 58, 76, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.65);
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      font-size: clamp(1.06rem, 3.8vw, 1.32rem);
      font-weight: 700;
      margin: 0;
      line-height: 1.2;
      color: var(--ink-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 下拉觸發按鈕與圖示按鈕（最小 48px 觸控尺寸 + 0.08s scale(0.96)） */
    .dd-btn {
      font: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--ink-1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px 10px 16px;
      min-height: 48px;
      min-width: 48px;
      border-radius: var(--r-ctrl);
      border: 1px solid rgba(255, 255, 255, 0.80);
      background: var(--glass-pill);
      -webkit-backdrop-filter: var(--blur-soft);
      backdrop-filter: var(--blur-soft);
      box-shadow: var(--spec-inset), var(--elev-well);
    }

    .dd-btn:focus-visible,
    .icon-btn:focus-visible,
    input[type="search"]:focus-visible,
    .dd-opt:focus-visible,
    .ledger-row:focus-visible {
      outline: none;
      box-shadow: var(--spec-inset), 0 0 0 3px rgba(98, 118, 140, 0.30), var(--elev-float);
    }

    .dd-btn .chev {
      width: 16px;
      height: 16px;
      color: var(--ink-2);
      transition: transform 0.42s var(--ease-spring);
      flex-shrink: 0;
    }

    .dd-btn[aria-expanded="true"] .chev {
      transform: rotate(180deg);
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      padding: 0;
      border-radius: var(--r-ctrl);
      border: 1px solid rgba(255, 255, 255, 0.80);
      background: var(--glass-pill);
      -webkit-backdrop-filter: var(--blur-soft);
      backdrop-filter: var(--blur-soft);
      box-shadow: var(--spec-inset), var(--elev-well);
      display: inline-grid;
      place-items: center;
      color: var(--ink-2);
      flex-shrink: 0;
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      display: block;
    }

    /* Portal 下拉選單：獨立掛載於 body 頂層 + 雙層冰晶 + 0.42s 手風琴 */
    .dd-portal {
      position: fixed;
      z-index: 220;
      min-width: 210px;
      max-width: calc(100vw - 32px);
      transform-origin: top right;
      transition:
        grid-template-rows 0.42s var(--ease-spring),
        opacity 0.30s var(--ease-spring),
        transform 0.42s var(--ease-spring),
        padding 0.42s var(--ease-spring),
        visibility 0s 0.42s;
    }

    .dd-portal:not(.is-open) {
      padding: 0 7px;
      border-top-width: 0;
      border-bottom-width: 0;
      visibility: hidden;
    }

    .dd-portal.is-open {
      padding: 7px;
      border-width: 1.5px;
      visibility: visible;
      transition:
        grid-template-rows 0.42s var(--ease-spring),
        opacity 0.30s var(--ease-spring),
        transform 0.42s var(--ease-spring),
        padding 0.42s var(--ease-spring),
        visibility 0s;
    }

    .dd-inner {
      border-radius: 19px;
    }

    .dd-scroll {
      max-height: min(56vh, 360px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px;
      outline: none;
    }

    .dd-group {
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      color: var(--ink-3);
      padding: 8px 12px 4px;
    }

    .dd-opt {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.92rem;
      color: var(--ink-1);
      text-align: left;
      padding: 10px 14px;
      border-radius: var(--r-ctrl);
      min-height: 48px;
      opacity: 0;
      transform: translateY(-4px);
    }

    .dd-portal.is-open .dd-opt {
      opacity: 1;
      transform: translateY(0);
    }

    @media (hover: hover) {
      .dd-opt:hover {
        background: rgba(255, 255, 255, 0.72);
        transform: translateY(-1px);
      }
    }

    .dd-opt[aria-selected="true"] {
      font-weight: 650;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 4px 12px -4px rgba(45, 58, 76, 0.12);
    }

    .dd-opt .tick {
      width: 16px;
      height: 16px;
      color: var(--sage);
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.2s ease, transform 0.25s var(--ease-spring);
      flex-shrink: 0;
    }

    .dd-opt[aria-selected="true"] .tick {
      opacity: 1;
      transform: scale(1);
    }

    .dd-opt .cur {
      font-size: 0.68rem;
      color: var(--ink-2);
      background: rgba(98, 118, 140, 0.14);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      margin-left: 6px;
    }

    /* 內容玻璃區塊 */
    .section-card {
      padding: 20px;
      margin-bottom: 16px;
      animation: floatIn 0.48s var(--ease-spring) both;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 1.04rem;
      font-weight: 650;
      margin: 0;
      color: var(--ink-1);
    }

    /* 三大指標卡 */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .metric {
      background: var(--glass-well);
      -webkit-backdrop-filter: var(--blur-soft);
      backdrop-filter: var(--blur-soft);
      border: 1px solid rgba(255, 255, 255, 0.80);
      border-radius: var(--r-card);
      padding: 15px 16px;
      box-shadow: var(--spec-inset), var(--elev-well);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.24s var(--ease-spring), box-shadow 0.24s var(--ease-spring);
    }

    @media (hover: hover) {
      .metric:hover {
        transform: translateY(-2px);
        box-shadow: var(--spec-inset), var(--elev-float);
      }
    }

    .metric .l {
      font-size: 0.78rem;
      color: var(--ink-2);
      font-weight: 600;
    }

    .metric .v {
      font-size: clamp(1.18rem, 3.2vw, 1.7rem);
      font-weight: 700;
      line-height: 1.25;
      margin: 6px 0 4px;
      color: var(--ink-1);
    }

    .metric .d {
      font-size: 0.74rem;
      color: var(--ink-3);
      font-weight: 500;
    }

    .pos {
      color: var(--sage) !important;
    }

    .neg {
      color: var(--rose) !important;
    }

    /* 搜尋列與手風琴搜尋結果 */
    .search-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .search-wrap .s-ico {
      position: absolute;
      left: 15px;
      width: 17px;
      height: 17px;
      color: var(--ink-3);
      pointer-events: none;
    }

    input[type="search"] {
      width: 100%;
      font: inherit;
      font-size: 0.94rem;
      color: var(--ink-1);
      appearance: none;
      -webkit-appearance: none;
      background: var(--glass-well);
      -webkit-backdrop-filter: var(--blur-soft);
      backdrop-filter: var(--blur-soft);
      border: 1px solid rgba(255, 255, 255, 0.80);
      border-radius: var(--r-ctrl);
      padding: 11px 14px 11px 42px;
      min-height: 48px;
      box-shadow: var(--spec-inset), var(--elev-well);
      transition: transform 0.24s var(--ease-spring), box-shadow 0.24s var(--ease-spring);
    }

    input[type="search"]::placeholder {
      color: var(--ink-3);
    }

    /* 環形圖與表格 */
    .split {
      display: grid;
      grid-template-columns: minmax(200px, 270px) 1fr;
      gap: 18px;
      align-items: center;
    }

    .pie-holder {
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.56) 0%, rgba(246, 250, 255, 0.36) 100%);
      border-radius: var(--r-card);
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--spec-inset), var(--elev-well);
    }

    svg.pie {
      width: 100%;
      height: auto;
      max-width: 240px;
      display: block;
      margin: auto;
      filter: drop-shadow(0 8px 16px rgba(45, 58, 76, 0.09));
    }

    svg.pie path {
      transition: transform 0.36s var(--ease-spring), opacity 0.24s ease;
      transform-origin: 150px 150px;
      cursor: pointer;
      stroke: rgba(255, 255, 255, 0.88);
      stroke-width: 2.2;
    }

    svg.pie path:hover,
    svg.pie path.on {
      transform: scale(1.045);
    }

    .table-well {
      background: var(--glass-well);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: var(--r-card);
      padding: 6px 10px;
      box-shadow: var(--spec-inset), var(--elev-well);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 4px;
      font-size: 0.9rem;
      color: var(--ink-1);
    }

    th {
      text-align: left;
      font-weight: 600;
      color: var(--ink-2);
      font-size: 0.75rem;
      padding: 10px 8px 6px;
      border-bottom: 1px solid rgba(100, 116, 139, 0.16);
    }

    td {
      padding: 10px 8px;
      vertical-align: middle;
      background: rgba(255, 255, 255, 0.46);
      transition: background-color 0.2s ease, transform 0.08s ease;
    }

    tbody tr.ledger-row {
      cursor: pointer;
    }

    tbody tr td:first-child {
      border-top-left-radius: var(--r-icon);
      border-bottom-left-radius: var(--r-icon);
    }

    tbody tr td:last-child {
      border-top-right-radius: var(--r-icon);
      border-bottom-right-radius: var(--r-icon);
    }

    @media (hover: hover) {
      tbody tr:hover td {
        background: rgba(255, 255, 255, 0.84);
      }
    }

    tbody tr.ledger-row:active td {
      background: rgba(255, 255, 255, 0.92);
    }

    td.n,
    th.n {
      text-align: right;
      white-space: nowrap;
      font-weight: 600;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 4px;
      margin-right: 8px;
      vertical-align: middle;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.88);
      color: var(--ink-1);
      box-shadow: 0 1px 3px rgba(45, 58, 76, 0.04);
      white-space: nowrap;
    }

    .badge-sub {
      background: rgba(98, 118, 140, 0.12);
      border-color: rgba(98, 118, 140, 0.18);
      color: var(--ink-2);
      font-weight: 500;
    }

    .date-pill {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
    }

    .muted {
      color: var(--ink-3);
      font-size: 0.86rem;
    }

    .status-box {
      padding: 20px 22px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .err {
      color: var(--rose);
      font-weight: 600;
    }

    /* Portal 原生彈窗 (body > dialog#detailDialog) + 雙層冰晶結構 */
    dialog.lg-dialog {
      border: 0;
      padding: 0;
      margin: auto;
      width: min(calc(100vw - 24px), 420px);
      max-width: none;
      max-height: calc(100vh - 32px);
      background: transparent;
      overflow: visible;
      color: var(--ink-1);
    }

    dialog.lg-dialog::backdrop {
      background: rgba(226, 234, 244, 0.42);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    .detail-frame {
      width: 100%;
    }

    .detail-inner {
      padding: 18px;
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .detail-head h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink-1);
    }

    .detail-amount {
      padding: 14px 16px;
      border-radius: var(--r-card);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: var(--spec-inset);
      margin-bottom: 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-amount .k {
      font-size: 0.82rem;
      color: var(--ink-2);
      font-weight: 600;
    }

    .detail-amount .v {
      font-size: 1.45rem;
      font-weight: 700;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .detail-cell {
      padding: 10px 12px;
      border-radius: var(--r-ctrl);
      background: rgba(255, 255, 255, 0.54);
      border: 1px solid rgba(255, 255, 255, 0.78);
    }

    .detail-cell.full {
      grid-column: 1 / -1;
    }

    .detail-cell .k {
      font-size: 0.74rem;
      color: var(--ink-3);
      margin-bottom: 2px;
    }

    .detail-cell .v {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink-1);
      word-break: break-word;
    }

    /* Portal 懸浮通知層 (body > #lgToastRoot) + 雙層冰晶結構 */
    .lg-toast-root {
      position: fixed;
      top: max(14px, env(safe-area-inset-top, 14px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 260;
      width: min(calc(100vw - 28px), 400px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .lg-toast {
      pointer-events: auto;
      width: 100%;
    }

    .toast-inner {
      padding: 10px 10px 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast-ico {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--rose);
    }

    .toast-msg {
      flex: 1;
      min-width: 0;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-1);
    }

    .toast-action {
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink-1);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 0 14px;
    }

    .status-retry {
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: var(--glass-pill);
      color: var(--ink-1);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0 20px;
    }

    /* 行動版響應式微調 (Pixel 10 Pro 412x915) */
    @media (max-width: 660px) {
      .metrics {
        grid-template-columns: 1fr 1fr;
      }
      .metrics .metric:last-child {
        grid-column: 1 / -1;
      }
      .split {
        grid-template-columns: 1fr;
      }
      .section-card {
        padding: 16px;
        border-radius: 24px;
      }
      header.topbar {
        border-radius: 24px;
        padding: 10px 10px 10px 12px;
      }
      .table-well {
        padding: 4px 6px;
      }
      td, th {
        padding: 8px 6px;
      }
      .hide-sm {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* sushi-portal-dock-start */
    .bottom-left-dock {
      position: fixed;
      left: 16px;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .bottom-left-dock .liquid-glass-btn {
      pointer-events: auto;
      width: 48px;
      height: 48px;
      min-width: 48px;
      min-height: 48px;
      border-radius: var(--r-ctrl);
      border: 1px solid rgba(255, 255, 255, 0.82);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.70) 0%,
        rgba(246, 250, 255, 0.44) 100%
      );
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.92),
        0 10px 24px -6px rgba(45, 58, 76, 0.14);
      color: var(--ink-1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }
    .bottom-left-dock .liquid-glass-btn svg {
      width: 19px;
      height: 19px;
      display: block;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.24s var(--ease-spring);
    }
    .bottom-left-dock .liquid-glass-btn:active svg.refresh-icon {
      transform: rotate(180deg);
    }
    .bottom-left-dock.sushi-portal-dock--embedded {
      display: none !important;
    }
    /* sushi-portal-dock-end */
  </style>
</head>
<body>
  <div class="lg-ambient-bg" aria-hidden="true"></div>

  <div id="app-shell" class="shell">
    <header class="topbar lg-glass">
      <div class="brand-group">
        <img class="brand-avatar" src="icon-192.png" alt="日常記帳本" width="40" height="40">
        <div class="brand-text">
          <h1>日常記帳本</h1>
        </div>
      </div>

      <div class="nav-actions">
        <button class="dd-btn lg-btn" id="ddBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="ddScroll" aria-label="選擇月份">
          <span id="ddLabel">讀取中</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>
    </header>

    <div id="status" class="lg-glass status-box muted" aria-live="polite">讀取中</div>

    <main id="app" hidden>
      <section class="lg-glass section-card">
        <div class="sec-head">
          <h2 id="mTitle"></h2>
        </div>
        <div class="metrics" id="metrics"></div>
      </section>

      <section class="lg-glass section-card">
        <div class="sec-head">
          <h2>關鍵字搜尋</h2>
        </div>
        <div class="search-bar">
          <div class="search-wrap">
            <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="M20 20l-3.5-3.5"/>
            </svg>
            <input type="search" id="q" placeholder="搜尋品名或分類" autocomplete="off">
          </div>
          <button class="icon-btn lg-btn" id="clr" type="button" aria-label="清除搜尋" title="清除搜尋">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
        <div class="lg-accordion" id="sBox">
          <div class="lg-accordion-inner" id="sResult"></div>
        </div>
      </section>

      <section class="lg-glass section-card" id="pieSec">
        <div class="sec-head">
          <h2 id="pTitle"></h2>
        </div>
        <div class="split">
          <div class="pie-holder" id="pie"></div>
          <div class="table-well">
            <table>
              <thead>
                <tr>
                  <th>大類</th>
                  <th class="n">金額</th>
                  <th class="n">占比</th>
                </tr>
              </thead>
              <tbody id="catBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="lg-glass section-card">
        <div class="sec-head">
          <h2 id="lTitle"></h2>
        </div>
        <div class="table-well">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>大類</th>
                <th class="hide-sm">小類</th>
                <th>品名</th>
                <th class="n">金額</th>
              </tr>
            </thead>
            <tbody id="ledger"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Portal 1：月份下拉選單（獨立掛載 document.body + 雙層冰晶 + 0.42s 手風琴） -->
  <div class="dd-portal lg-ice-frame lg-accordion" id="ddPanel" aria-hidden="true">
    <div class="lg-accordion-inner">
      <div class="lg-inner-glass dd-inner">
        <div class="dd-scroll" id="ddScroll" role="listbox" aria-label="月份" tabindex="-1"></div>
      </div>
    </div>
  </div>

  <!-- Portal 2：交易明細彈窗（獨立掛載 document.body + 雙層冰晶 + 微回彈進退場） -->
  <dialog id="detailDialog" class="lg-dialog" aria-labelledby="detailTitle">
    <div id="detailFrame" class="lg-ice-frame detail-frame">
      <div class="lg-inner-glass detail-inner">
        <div class="detail-head">
          <h3 id="detailTitle">交易明細</h3>
          <button id="detailClose" class="icon-btn lg-btn" type="button" aria-label="關閉">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
        <div id="detailBody"></div>
      </div>
    </div>
  </dialog>

  <!-- Portal 3：懸浮通知容器（獨立掛載 document.body + 雙層冰晶 + 微回彈進退場） -->
  <div id="lgToastRoot" class="lg-toast-root" aria-live="polite"></div>

  <!-- sushi-portal-dock-start -->
  <div class="bottom-left-dock">
    <button id="liquid-back-btn" class="liquid-glass-btn lg-btn" type="button" title="返回" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <button id="liquid-refresh-btn" class="liquid-glass-btn lg-btn" type="button" title="重新整理" aria-label="重新整理">
      <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" />
        <polyline points="21 3 21 9 15 9" />
      </svg>
    </button>
  </div>
  <!-- sushi-portal-dock-end -->

  <script type="module">
    import { attachAndroidEdgeStretch } from './android-overscroll.js';

    const SHEET_ID = "1hdZuk6u1XQvevxlKiYhbFhK0lj3DMIn6JjcGY1HiWVk";
    const URLS = [
      "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&headers=1",
      "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv"
    ];
    // 低飽和莫蘭迪色盤
    const COLORS = [
      "#8fa8be", "#c99da3", "#8eb3a2", "#cbb494",
      "#a89bbd", "#a3b899", "#cfa58e", "#95b0bd",
      "#bfa1b8", "#a9abb3", "#b5c4a1", "#9bb4cc",
      "#c7a79e", "#9dc0be"
    ];
    const TODAY = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Taipei",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).format(new Date());

    const $ = (id) => document.getElementById(id);
    const fmt = (n) => n.toLocaleString("en-US");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));

    function parseCSV(text) {
      const rows = [];
      let row = [], f = "", q = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) {
          if (c === '"') {
            if (text[i + 1] === '"') { f += '"'; i++; }
            else q = false;
          } else f += c;
        } else if (c === '"') q = true;
        else if (c === ',') { row.push(f); f = ""; }
        else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ""; }
        else if (c !== '\r') f += c;
      }
      if (f !== "" || row.length) { row.push(f); rows.push(row); }
      return rows;
    }

    function normDate(s) {
      const m = String(s).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
      return m ? m[1] + "-" + m[2].padStart(2, "0") + "-" + m[3].padStart(2, "0") : "";
    }

    function toRecords(rows) {
      const h = rows[0].map((x) => x.trim());
      const ix = (n) => h.indexOf(n);
      const I = {
        d: ix("日期"),
        t: ix("收支"),
        c: ix("大類"),
        s: ix("小類"),
        n: ix("品名"),
        a: ix("金額"),
        no: ix("備註")
      };
      if (I.d < 0 || I.a < 0 || I.t < 0) throw new Error("試算表欄位不符");
      return rows.slice(1).map((r, k) => ({
        k,
        d: normDate(r[I.d]),
        income: (r[I.t] || "").trim() === "收入",
        cat: (r[I.c] || "").trim(),
        sub: (r[I.s] || "").trim(),
        name: I.n >= 0 ? (r[I.n] || "").trim() : "",
        note: I.no >= 0 ? (r[I.no] || "").trim() : "",
        amt: Number(String(r[I.a] || "").replace(/[^\d.-]/g, "")) || 0
      }))
      .filter((r) => r.d && r.d <= TODAY)
      .sort((a, b) => a.d === b.d ? b.k - a.k : (a.d < b.d ? 1 : -1));
    }

    async function load() {
      let lastErr;
      for (const u of URLS) {
        try {
          const res = await fetch(u + "&_=" + Date.now(), { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const t = await res.text();
          if (/^\s*</.test(t)) throw new Error("試算表無法讀取");
          return toRecords(parseCSV(t));
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr;
    }

    let RECS = [], REC_MAP = new Map(), month = "";
    const label = (m) => m.slice(0, 4) + " 年 " + Number(m.slice(5)) + " 月";
    const amtCell = (r) => `<td class="n tabular-nums ${r.income ? "pos" : "neg"}">${r.income ? "+" : "−"}${fmt(r.amt)}</td>`;
    const fullName = (r) => {
      const n = (r.name || "").trim(), o = (r.note || "").trim();
      if (!o || n.includes(o)) return n;
      if (!n || o.includes(n)) return o;
      return o + " " + n;
    };
    const dash = (s) => s ? esc(s) : '<span class="muted">—</span>';
    const catBadge = (s) => s ? `<span class="badge">${esc(s)}</span>` : '<span class="muted">—</span>';
    const subBadge = (s) => s ? `<span class="badge badge-sub">${esc(s)}</span>` : '<span class="muted">—</span>';

    /* Portal 通知：雙層冰晶 + 微回彈進退場 */
    function dismissToast(el) {
      if (!el || el.dataset.closing) return;
      el.dataset.closing = "1";
      el.classList.remove("lg-pop-enter");
      el.classList.add("lg-pop-exit");
      const remove = () => { if (el.parentNode) el.remove(); };
      el.addEventListener("animationend", remove, { once: true });
      setTimeout(remove, 240);
    }

    function showToast(message, opts = {}) {
      const root = $("lgToastRoot");
      root.replaceChildren();
      const card = document.createElement("div");
      card.className = "lg-toast lg-ice-frame lg-pop-enter";
      card.setAttribute("role", "status");
      card.innerHTML =
        `<div class="lg-inner-glass toast-inner">
          <svg class="toast-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v5"/>
            <path d="M12 16.5h.01"/>
          </svg>
          <span class="toast-msg">${esc(message)}</span>
          ${opts.actionLabel ? `<button type="button" class="toast-action lg-btn">${esc(opts.actionLabel)}</button>` : ""}
          <button type="button" class="icon-btn lg-btn toast-close" aria-label="關閉">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>`;
      root.appendChild(card);

      card.querySelector(".toast-close").onclick = () => dismissToast(card);
      const actBtn = card.querySelector(".toast-action");
      if (actBtn && typeof opts.onAction === "function") {
        actBtn.onclick = () => {
          dismissToast(card);
          opts.onAction();
        };
      }
      if (opts.autoDismissMs) {
        setTimeout(() => dismissToast(card), opts.autoDismissMs);
      }
    }

    /* Portal 交易明細彈窗：雙層冰晶 + 微回彈進退場 */
    const detailDialog = $("detailDialog");
    const detailFrame = $("detailFrame");
    let closingModal = false;

    function openDetailModal(rec) {
      if (!rec) return;
      closingModal = false;
      detailFrame.classList.remove("lg-pop-exit", "lg-pop-enter");
      void detailFrame.offsetWidth;
      detailFrame.classList.add("lg-pop-enter");

      const itemText = fullName(rec) || "—";
      $("detailBody").innerHTML =
        `<div class="detail-amount">
          <span class="k">${rec.income ? "收入" : "支出"}</span>
          <span class="v tabular-nums ${rec.income ? "pos" : "neg"}">${rec.income ? "+" : "−"}NT$ ${fmt(rec.amt)}</span>
        </div>
        <div class="detail-grid">
          <div class="detail-cell"><div class="k">日期</div><div class="v tabular-nums">${esc(rec.d)}</div></div>
          <div class="detail-cell"><div class="k">大類</div><div class="v">${esc(rec.cat || "—")}</div></div>
          <div class="detail-cell"><div class="k">小類</div><div class="v">${esc(rec.sub || "—")}</div></div>
          <div class="detail-cell"><div class="k">收支</div><div class="v">${rec.income ? "收入" : "支出"}</div></div>
          <div class="detail-cell full"><div class="k">品名</div><div class="v">${esc(itemText)}</div></div>
        </div>`;

      if (!detailDialog.open) detailDialog.showModal();
    }

    function closeDetailModal() {
      if (!detailDialog.open || closingModal) return;
      closingModal = true;
      detailFrame.classList.remove("lg-pop-enter");
      detailFrame.classList.add("lg-pop-exit");
      const finish = () => {
        if (!closingModal) return;
        closingModal = false;
        detailFrame.classList.remove("lg-pop-exit");
        if (detailDialog.open) detailDialog.close();
      };
      detailFrame.addEventListener("animationend", finish, { once: true });
      setTimeout(finish, 240);
    }

    $("detailClose").onclick = closeDetailModal;
    detailDialog.addEventListener("click", (e) => {
      if (e.target === detailDialog) closeDetailModal();
    });
    detailDialog.addEventListener("cancel", (e) => {
      e.preventDefault();
      closeDetailModal();
    });

    function bindRowClicks(tbody) {
      tbody.onclick = (e) => {
        const tr = e.target.closest("tr[data-rec-id]");
        if (tr) openDetailModal(REC_MAP.get(Number(tr.dataset.recId)));
      };
      tbody.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") {
          const tr = e.target.closest("tr[data-rec-id]");
          if (tr) {
            e.preventDefault();
            openDetailModal(REC_MAP.get(Number(tr.dataset.recId)));
          }
        }
      };
    }

    function renderMonth() {
      const L = label(month);
      const recs = RECS.filter((r) => r.d.slice(0, 7) === month);
      const inc = recs.filter((r) => r.income), exp = recs.filter((r) => !r.income);
      const I = inc.reduce((s, r) => s + r.amt, 0);
      const E = exp.reduce((s, r) => s + r.amt, 0);
      const B = I - E;

      $("mTitle").textContent = L + "帳本";
      const isCur = month === TODAY.slice(0, 7), P = isCur ? "本月" : "當月";
      const lastDay = new Date(Number(month.slice(0, 4)), Number(month.slice(5)), 0).getDate();
      const range = isCur
        ? `計至 <span class="tabular-nums">${TODAY}</span>`
        : `${L}（<span class="tabular-nums">${Number(month.slice(5))}/1–${Number(month.slice(5))}/${lastDay}</span>）`;

      $("metrics").innerHTML =
        `<div class="metric"><div class="l">${P}收入</div><div class="v tabular-nums pos">NT$ ${fmt(I)}</div><div class="d"><span class="tabular-nums">${inc.length}</span> 筆</div></div>` +
        `<div class="metric"><div class="l">${P}支出</div><div class="v tabular-nums neg">NT$ ${fmt(E)}</div><div class="d"><span class="tabular-nums">${exp.length}</span> 筆</div></div>` +
        `<div class="metric"><div class="l">${P}結餘</div><div class="v tabular-nums ${B >= 0 ? "pos" : "neg"}">NT$ ${fmt(B)}</div><div class="d">${range}</div></div>`;

      const by = {};
      exp.forEach((r) => {
        by[r.cat || "未分類"] = (by[r.cat || "未分類"] || 0) + r.amt;
      });
      const cats = Object.entries(by).sort((a, b) => b[1] - a[1]);
      $("pieSec").hidden = E <= 0;
      $("pTitle").textContent = L + "支出大類占比";

      let a0 = -Math.PI / 2, paths = "";
      cats.forEach(([c, v], i) => {
        const a1 = a0 + 2 * Math.PI * v / E;
        const large = a1 - a0 > Math.PI ? 1 : 0;
        const R = 138, r = 80, cx = 150, cy = 150;
        const p = (ang, rad) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)].map((x) => x.toFixed(2)).join(" ");
        const d = cats.length === 1
          ? `M ${p(0, R)} A ${R} ${R} 0 1 1 ${p(Math.PI, R)} A ${R} ${R} 0 1 1 ${p(0, R)} M ${p(0, r)} A ${r} ${r} 0 1 0 ${p(Math.PI, r)} A ${r} ${r} 0 1 0 ${p(0, r)} Z`
          : `M ${p(a0, R)} A ${R} ${R} 0 ${large} 1 ${p(a1, R)} L ${p(a1, r)} A ${r} ${r} 0 ${large} 0 ${p(a0, r)} Z`;
        paths += `<path d="${d}" fill="${COLORS[i % COLORS.length]}" fill-rule="evenodd" data-i="${i}"><title>${esc(c)} NT$ ${fmt(v)}（${(v / E * 100).toFixed(1)}%）</title></path>`;
        a0 = a1;
      });

      $("pie").innerHTML = `<svg class="pie" viewBox="0 0 300 300" role="img" aria-label="支出大類占比">${paths}
        <text x="150" y="142" text-anchor="middle" font-size="13" fill="#475569">${isCur ? "本月" : "當月"}支出</text>
        <text class="tabular-nums" x="150" y="168" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">NT$ ${fmt(E)}</text></svg>`;

      $("catBody").innerHTML = cats.map(([c, v], i) =>
        `<tr data-i="${i}"><td><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>${esc(c)}</td><td class="n tabular-nums">NT$ ${fmt(v)}</td><td class="n tabular-nums">${(v / E * 100).toFixed(1)}%</td></tr>`
      ).join("");

      const hl = (i, on) => {
        const el = $("pie").querySelector(`path[data-i="${i}"]`);
        if (el) el.classList.toggle("on", on);
      };
      $("catBody").querySelectorAll("tr").forEach((tr) => {
        tr.onpointerenter = () => hl(tr.dataset.i, true);
        tr.onpointerleave = () => hl(tr.dataset.i, false);
      });

      $("lTitle").textContent = L + "流水帳";
      const ledgerEl = $("ledger");
      ledgerEl.innerHTML = recs.map((r) =>
        `<tr class="ledger-row" data-rec-id="${r.k}" tabindex="0" role="button" aria-label="${esc(fullName(r) || r.cat)}">
          <td><span class="date-pill tabular-nums">${r.d.slice(5).replace("-", "/")}</span></td>
          <td>${catBadge(r.cat)}</td>
          <td class="hide-sm">${subBadge(r.sub)}</td>
          <td>${dash(fullName(r))}</td>
          ${amtCell(r)}
        </tr>`
      ).join("") || `<tr><td colspan="5" class="muted" style="text-align:center;padding:18px">本月無紀錄</td></tr>`;
      bindRowClicks(ledgerEl);
    }

    function setupDropdown(months, cur) {
      const panelEl = $("ddPanel"), list = $("ddScroll"), btn = $("ddBtn");
      const years = [...new Set(months.map((m) => m.slice(0, 4)))];
      list.innerHTML = years.map((y) =>
        `<div class="dd-group" role="presentation">${y} 年</div>` +
        months.filter((m) => m.startsWith(y)).map((m) =>
          `<button type="button" class="dd-opt lg-btn" role="option" data-m="${m}" tabindex="-1">
            <span>${Number(m.slice(5))} 月${m === cur ? '<span class="cur">本月</span>' : ''}</span>
            <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12.5l4.5 4.5L19 7.5"/>
            </svg>
          </button>`
        ).join("")
      ).join("");

      const opts = () => [...list.querySelectorAll(".dd-opt")];
      const sync = () => {
        $("ddLabel").textContent = label(month);
        opts().forEach((o) => o.setAttribute("aria-selected", String(o.dataset.m === month)));
      };

      const positionPanel = () => {
        const rect = btn.getBoundingClientRect();
        const vw = document.documentElement.clientWidth;
        const panelW = Math.min(Math.max(220, rect.width + 44), vw - 32);
        const left = Math.max(16, Math.min(vw - panelW - 16, rect.right - panelW));
        const top = Math.min(rect.bottom + 8, Math.max(16, window.innerHeight - 160));
        panelEl.style.width = panelW + "px";
        panelEl.style.left = left + "px";
        panelEl.style.top = top + "px";
      };

      const openDD = (focus) => {
        positionPanel();
        panelEl.classList.add("is-open");
        panelEl.setAttribute("aria-hidden", "false");
        btn.setAttribute("aria-expanded", "true");
        const sel = list.querySelector('[aria-selected="true"]');
        if (sel) {
          const vh = Math.min(list.scrollHeight, parseFloat(getComputedStyle(list).maxHeight) || 360);
          list.scrollTop = Math.max(0, sel.offsetTop - vh / 2 + sel.offsetHeight / 2);
          if (focus) sel.focus({ preventScroll: true });
        }
      };

      const closeDD = (focus) => {
        if (!panelEl.classList.contains("is-open")) return;
        panelEl.classList.remove("is-open");
        panelEl.setAttribute("aria-hidden", "true");
        btn.setAttribute("aria-expanded", "false");
        if (focus) btn.focus();
      };

      const choose = (m) => {
        month = m;
        sync();
        renderMonth();
        closeDD(true);
      };

      list.onclick = (e) => {
        const o = e.target.closest(".dd-opt");
        if (o) choose(o.dataset.m);
      };
      btn.onclick = () => panelEl.classList.contains("is-open") ? closeDD(true) : openDD(true);
      btn.onkeydown = (e) => {
        if (["ArrowDown", "ArrowUp", "Enter", " "].includes(e.key)) {
          e.preventDefault();
          openDD(true);
        }
      };
      list.onkeydown = (e) => {
        const os = opts(), i = os.indexOf(document.activeElement);
        if (e.key === "ArrowDown") { e.preventDefault(); os[Math.min(os.length - 1, i + 1)].focus(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); os[Math.max(0, i - 1)].focus(); }
        else if (e.key === "Home") { e.preventDefault(); os[0].focus(); }
        else if (e.key === "End") { e.preventDefault(); os[os.length - 1].focus(); }
        else if (e.key === "Escape" || e.key === "Tab") { e.preventDefault(); closeDD(true); }
      };

      document.addEventListener("pointerdown", (e) => {
        if (!panelEl.contains(e.target) && !btn.contains(e.target)) closeDD(false);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !detailDialog.open) closeDD(true);
      });
      window.addEventListener("resize", () => {
        if (panelEl.classList.contains("is-open")) positionPanel();
      });
      window.addEventListener("scroll", () => {
        if (panelEl.classList.contains("is-open")) positionPanel();
      }, { passive: true });

      positionPanel();
      window.openDD = openDD;
      window.closeDD = closeDD;
      sync();
    }

    function renderSearch() {
      const raw = $("q").value.trim(), q = raw.toLowerCase();
      const box = $("sResult"), wrap = $("sBox");
      if (!q) {
        wrap.classList.remove("is-open");
        setTimeout(() => { if (!$("q").value.trim()) box.innerHTML = ""; }, 440);
        return;
      }
      const m = RECS.filter((r) => [r.name, r.note, r.cat, r.sub].some((x) => x.toLowerCase().includes(q)));
      wrap.classList.add("is-open");
      if (!m.length) {
        box.innerHTML = `<p class="muted" style="margin:14px 4px 2px">查無「${esc(raw)}」</p>`;
        return;
      }
      const E = m.filter((r) => !r.income).reduce((s, r) => s + r.amt, 0);
      const I = m.filter((r) => r.income).reduce((s, r) => s + r.amt, 0);
      box.innerHTML =
        `<div class="metrics" style="margin-top:16px">
          <div class="metric"><div class="l">符合筆數</div><div class="v"><span class="tabular-nums">${fmt(m.length)}</span> 筆</div></div>
          <div class="metric"><div class="l">支出合計</div><div class="v tabular-nums neg">NT$ ${fmt(E)}</div></div>
          <div class="metric"><div class="l">收入合計</div><div class="v tabular-nums pos">NT$ ${fmt(I)}</div></div>
        </div>
        <div class="table-well" style="margin-top:14px">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th class="hide-sm">收支</th>
                <th>大類</th>
                <th class="hide-sm">小類</th>
                <th>品名</th>
                <th class="n">金額</th>
              </tr>
            </thead>
            <tbody id="searchBody">${
              m.map((r) =>
                `<tr class="ledger-row" data-rec-id="${r.k}" tabindex="0" role="button" aria-label="${esc(fullName(r) || r.cat)}">
                  <td><span class="date-pill tabular-nums">${r.d}</span></td>
                  <td class="hide-sm">${r.income ? "收入" : "支出"}</td>
                  <td>${catBadge(r.cat)}</td>
                  <td class="hide-sm">${subBadge(r.sub)}</td>
                  <td>${dash(fullName(r))}</td>
                  ${amtCell(r)}
                </tr>`
              ).join("")
            }</tbody>
          </table>
        </div>`;
      const sb = $("searchBody");
      if (sb) bindRowClicks(sb);
    }

    async function init() {
      $("status").hidden = false;
      $("status").textContent = "讀取中";
      try {
        RECS = await load();
        REC_MAP = new Map(RECS.map((r) => [r.k, r]));
        const months = [...new Set(RECS.map((r) => r.d.slice(0, 7)))].sort().reverse();
        const cur = TODAY.slice(0, 7);
        if (!months.includes(cur)) months.unshift(cur);
        month = cur;
        const qm = new URLSearchParams(location.search).get("m");
        if (qm && months.includes(qm)) month = qm;
        setupDropdown(months, cur);
        if (new URLSearchParams(location.search).get("open") === "1") window.openDD(false);
        $("q").oninput = renderSearch;
        $("clr").onclick = () => {
          $("q").value = "";
          renderSearch();
          $("q").focus();
        };

        renderMonth();
        $("status").hidden = true;
        $("app").hidden = false;
      } catch (e) {
        $("ddLabel").textContent = "讀取失敗";
        $("status").innerHTML = `<span class="err">無法讀取資料</span><button type="button" class="status-retry lg-btn" id="retryBtn">重試</button>`;
        const retryBtn = $("retryBtn");
        if (retryBtn) retryBtn.onclick = init;
        showToast("無法讀取資料", { actionLabel: "重試", onAction: init });
      }
    }

    attachAndroidEdgeStretch(
      document.scrollingElement || document.documentElement,
      document.getElementById("app-shell")
    );
    init();

    // 註冊 PWA Service Worker 支援 Android Chrome 安裝至主畫面
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>

  <!-- sushi-portal-dock-start -->
  <script>
    (function () {
      var PORTAL = 'https://bard0228.github.io/3d-sushi-portal/index.html';
      var dock = document.querySelector('.bottom-left-dock');
      if (!dock) return;
      var embedded = false;
      try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
      if (embedded) {
        dock.classList.add('sushi-portal-dock--embedded');
        return;
      }
      var back = document.getElementById('liquid-back-btn');
      var refresh = document.getElementById('liquid-refresh-btn');
      if (back) back.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = PORTAL;
      });
      if (refresh) refresh.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        window.location.reload();
      });
    })();
  </script>
  <!-- sushi-portal-dock-end -->
</body>
